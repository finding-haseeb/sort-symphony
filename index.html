<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sort Symphony</title>
<style>
  body { margin: 0; background: #0e0e14; color: #eee; font-family: system-ui, sans-serif; text-align: center; }
  h1 { margin: 18px 0 4px; letter-spacing: 2px; }
  p { color: #999; margin: 0 0 12px; }
  #bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  button, select { background: #22223a; color: #eee; border: 1px solid #444; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  button:hover { background: #33335a; }
  canvas { width: 95vw; height: 65vh; background: #15151f; border-radius: 10px; }
  #stats { margin-top: 8px; color: #aaa; }
</style>
</head>
<body>
<h1>SORT SYMPHONY</h1>
<p>Every comparison plays a note. Hear how algorithms think.</p>
<div id="bar">
  <select id="algo">
    <option value="bubble">Bubble Sort</option>
    <option value="insertion">Insertion Sort</option>
    <option value="selection">Selection Sort</option>
    <option value="quick">Quick Sort</option>
    <option value="merge">Merge Sort</option>
    <option value="heap">Heap Sort</option>
  </select>
  <select id="size">
    <option>16</option><option selected>32</option><option>64</option><option>128</option>
  </select>
  <select id="speed">
    <option value="40">Slow</option><option value="10" selected>Normal</option><option value="1">Fast</option>
  </select>
  <button id="shuffle">Shuffle</button>
  <button id="play">Play</button>
  <button id="mute">Sound: On</button>
</div>
<canvas id="cv"></canvas>
<div id="stats">Comparisons: 0 | Swaps: 0</div>

<script>
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let arr = [], hi = {}, comps = 0, swaps = 0, running = false, sound = true, audio = null;

function resize() { cv.width = cv.clientWidth; cv.height = cv.clientHeight; draw(); }

function shuffle() {
    const n = +document.getElementById("size").value;
    arr = [];
    for (let i = 1; i <= n; i++) arr.push(i);
    for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    hi = {}; comps = 0; swaps = 0;
    draw();
}

function draw() {
    document.getElementById("stats").textContent = `Comparisons: ${comps} | Swaps: ${swaps}`;
}

// each value is a little creature: it hops to its new spot, looks at the one it is compared with
const vis = {};
function render(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    const n = arr.length, w = cv.width / n, base = cv.height - 6;
    const ids = Object.keys(hi).map(Number), seen = new Set();
    for (let i = 0; i < n; i++) {
        const v = arr[i];
        const o = vis[v] || (vis[v] = { x: i, sx: i, t: i });
        let px = i, hop = 0;
        if (!seen.has(v)) {
            seen.add(v);
            if (o.t !== i) { o.sx = o.x; o.t = i; }
            o.x += (i - o.x) * 0.2;
            const full = Math.abs(i - o.sx);
            if (full > 0.01) hop = Math.sin((1 - Math.abs(i - o.x) / full) * Math.PI) * Math.min(full, 4) * w * 0.5;
            px = o.x;
        }
        const bw = Math.max(w - 3, 1);
        const h = Math.max((v / n) * (cv.height - 50), bw);
        const x = px * w + 1.5, y = base - h - hop + Math.sin(t / 300 + i) * 2;
        const state = hi[i];

        ctx.fillStyle = `hsl(${(v / n) * 300}, 70%, 55%)`;
        ctx.beginPath(); ctx.roundRect(x, y, bw, h, Math.min(bw / 2, 14)); ctx.fill();
        if (state) { ctx.strokeStyle = state; ctx.lineWidth = 2; ctx.stroke(); }
        if (bw < 8) continue;

        let dir = 0;
        if (state && ids.length == 2) dir = (ids[0] == i ? ids[1] : ids[0]) > i ? 1 : -1;
        const blink = (Math.floor(t / 100) + v * 7) % 40 == 0;
        const er = bw * 0.14, ey = y + bw * 0.35;
        for (const ex of [x + bw * 0.32, x + bw * 0.68]) {
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.ellipse(ex, ey, er, blink ? er * 0.15 : er, 0, 0, 7); ctx.fill();
            if (!blink) {
                ctx.fillStyle = "#111";
                ctx.beginPath(); ctx.arc(ex + dir * er * 0.5, ey, er * 0.5, 0, 7); ctx.fill();
            }
        }

        const mx = x + bw / 2, my = y + bw * 0.62;
        ctx.strokeStyle = "#111"; ctx.lineWidth = Math.max(1, bw * 0.05);
        ctx.beginPath();
        if (state == "#3ddc97") ctx.arc(mx, my - bw * 0.08, bw * 0.18, 0.15 * Math.PI, 0.85 * Math.PI);
        else if (state == "#ff4d6d") ctx.arc(mx, my, bw * 0.1, 0, 7);
        else { ctx.moveTo(mx - bw * 0.12, my); ctx.lineTo(mx + bw * 0.12, my); }
        ctx.stroke();
    }
    requestAnimationFrame(render);
}
requestAnimationFrame(render);

function beep(v) {
    if (!sound) return;
    if (!audio) audio = new AudioContext();
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = "triangle";
    osc.frequency.value = 200 + (v / arr.length) * 900;
    gain.gain.setValueAtTime(0.08, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.08);
    osc.connect(gain).connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + 0.08);
}

const sleep = () => new Promise(r => setTimeout(r, +document.getElementById("speed").value));

async function cmp(i, j) {
    comps++;
    hi = { [i]: "#fff", [j]: "#fff" };
    beep(arr[i]); draw(); await sleep();
    return arr[i] > arr[j];
}

async function swap(i, j) {
    swaps++;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    hi = { [i]: "#ff4d6d", [j]: "#ff4d6d" };
    beep(arr[j]); draw(); await sleep();
}

async function setAt(i, v) {
    swaps++;
    arr[i] = v;
    hi = { [i]: "#ff4d6d" };
    beep(v); draw(); await sleep();
}

const algos = {
    async bubble() {
        const n = arr.length;
        for (let i = 0; i < n; i++)
            for (let j = 0; j < n - i - 1; j++)
                if (await cmp(j, j + 1)) await swap(j, j + 1);
    },
    async insertion() {
        for (let i = 1; i < arr.length; i++)
            for (let j = i; j > 0 && await cmp(j - 1, j); j--) await swap(j - 1, j);
    },
    async selection() {
        const n = arr.length;
        for (let i = 0; i < n; i++) {
            let mn = i;
            for (let j = i + 1; j < n; j++) if (await cmp(mn, j)) mn = j;
            if (mn != i) await swap(i, mn);
        }
    },
    async quick(l = 0, r = arr.length - 1) {
        if (l >= r) return;
        let p = l;
        for (let i = l; i < r; i++)
            if (!(await cmp(i, r))) { await swap(i, p); p++; }
        await swap(p, r);
        await algos.quick(l, p - 1);
        await algos.quick(p + 1, r);
    },
    async merge(l = 0, r = arr.length - 1) {
        if (l >= r) return;
        const m = Math.floor((l + r) / 2);
        await algos.merge(l, m);
        await algos.merge(m + 1, r);
        const tmp = [];
        let i = l, j = m + 1;
        while (i <= m && j <= r) tmp.push((await cmp(i, j)) ? arr[j++] : arr[i++]);
        while (i <= m) tmp.push(arr[i++]);
        while (j <= r) tmp.push(arr[j++]);
        for (let k = 0; k < tmp.length; k++) await setAt(l + k, tmp[k]);
    },
    async heap() {
        const n = arr.length;
        async function heapify(sz, i) {
            let big = i;
            const a = 2 * i + 1, b = 2 * i + 2;
            if (a < sz && await cmp(a, big)) big = a;
            if (b < sz && await cmp(b, big)) big = b;
            if (big != i) { await swap(i, big); await heapify(sz, big); }
        }
        for (let i = Math.floor(n / 2) - 1; i >= 0; i--) await heapify(n, i);
        for (let i = n - 1; i > 0; i--) { await swap(0, i); await heapify(i, 0); }
    }
};

async function finale() {
    for (let i = 0; i < arr.length; i++) {
        hi = {};
        for (let k = 0; k <= i; k++) hi[k] = "#3ddc97";
        beep(arr[i]); draw();
        await new Promise(r => setTimeout(r, 8));
    }
}

document.getElementById("shuffle").onclick = () => { if (!running) shuffle(); };
document.getElementById("mute").onclick = e => {
    sound = !sound;
    e.target.textContent = "Sound: " + (sound ? "On" : "Off");
};
document.getElementById("play").onclick = async () => {
    if (running) return;
    running = true;
    comps = 0; swaps = 0;
    await algos[document.getElementById("algo").value]();
    await finale();
    running = false;
};
document.getElementById("size").onchange = () => { if (!running) shuffle(); };
window.onresize = resize;
shuffle();
resize();
</script>
</body>
</html>
